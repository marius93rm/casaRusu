<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Casa Rusu concept 1 — doorway mark</title>
  <desc id="desc">A simple CR monogram inside a doorway arch with a threshold and a CASA RUSU wordmark.</desc>
  <style>
    .ink-fill { fill: #122336; }
    .ink-stroke { stroke: #122336; }
    .brass-fill { fill: #b29862; }
    .brass-stroke { stroke: #b29862; }
    @media (prefers-color-scheme: dark) {
      .ink-fill { fill: #f8f3e8; }
      .ink-stroke { stroke: #f8f3e8; }
      .brass-fill { fill: #d0b27a; }
      .brass-stroke { stroke: #d0b27a; }
    }
  </style>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path class="ink-stroke" d="M58 282V137a112 112 0 0 1 224 0v145" stroke-width="12"/>
    <path class="brass-stroke" d="M76 282h188" stroke-width="8"/>
  </g>
  <text class="ink-fill" x="170" y="218" font-family="'Cormorant Garamond', 'Cormorant Garamond Light', Georgia, serif" font-size="104" font-weight="600" letter-spacing="-8" text-anchor="middle">CR</text>
  <path class="brass-stroke" d="M358 282h752" fill="none" stroke-width="2"/>
  <text class="ink-fill" x="358" y="166" font-family="'Cormorant Garamond', 'Cormorant Garamond Light', Georgia, serif" font-size="92" font-weight="600" letter-spacing="5">CASA RUSU</text>
  <text class="brass-fill" x="362" y="218" font-family="'DM Sans', 'DM Sans Regular', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="7">RESTAURANT</text>
</svg>
