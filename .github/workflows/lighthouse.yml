name: Lighthouse
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      # Chrome runs only on this disposable GitHub-hosted runner.
      # Local development uses the attach-only Node script above.
      - name: Start audit services on the isolated runner
        run: |
          npm exec -- astro preview --host 127.0.0.1 --port 4325 > /tmp/preview.log 2>&1 &
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/lighthouse-profile about:blank > /tmp/chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4325/ > /dev/null && curl -fsS http://127.0.0.1:9222/json/version > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log /tmp/chrome.log
          exit 1
      - run: npm run audit:lighthouse
        env:
          LIGHTHOUSE_PORT: '9222'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
          retention-days: 14
